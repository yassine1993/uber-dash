# NOTE: Netlify is NOT suitable for hosting Streamlit apps
# Streamlit requires a persistent server process, which Netlify does not support.
# Netlify is designed for static sites and serverless functions, not long-running Python servers.
#
# RECOMMENDED: Deploy to Streamlit Cloud instead:
# 1. Go to https://share.streamlit.io
# 2. Connect your GitHub repository
# 3. Deploy with one click (free)
#
# Alternative platforms for Streamlit:
# - Streamlit Cloud: https://streamlit.io/cloud (Recommended - Free)
# - Render: https://render.com
# - Railway: https://railway.app
# - Heroku: https://heroku.com
# - Fly.io: https://fly.io

[build]
  # Create a simple static page explaining this app should be on Streamlit Cloud
  command = "echo 'Static page created - see index.html'"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"
